<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1350" width="100%" height="100%">
  <defs>
    <!-- DC3 Navy Background Gradient -->
    <linearGradient id="dc3-bg-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#061830"/>
      <stop offset="50%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#061830"/>
    </linearGradient>

    <!-- DC3 Card Fill Gradient -->
    <linearGradient id="dc3-card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2440"/>
      <stop offset="100%" stop-color="#0A192F"/>
    </linearGradient>
    
    <!-- DC3 Gold Accent Gradient -->
    <linearGradient id="dc3-gold-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFC809"/>
      <stop offset="100%" stop-color="#FFCC00"/>
    </linearGradient>

    <!-- DC3 Blue Accent Gradient -->
    <linearGradient id="dc3-blue-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0066CC"/>
      <stop offset="100%" stop-color="#1E88E5"/>
    </linearGradient>

    <linearGradient id="dc3-cyan-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <linearGradient id="dc3-green-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38F9D7"/>
      <stop offset="100%" stop-color="#43E97B"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dc3-shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Marker Arrow Down -->
    <marker id="dc3-arrow-gold" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 0 L 5 10 L 9 0 z" fill="#FFC809" />
    </marker>
    <marker id="dc3-arrow-cyan" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 0 L 5 10 L 9 0 z" fill="#00F2FE" />
    </marker>
    <marker id="dc3-arrow-green" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 0 L 5 10 L 9 0 z" fill="#38F9D7" />
    </marker>
  </defs>

  <style>
    .title-dc3 { font-family: 'Times New Roman', Georgia, serif; font-size: 22px; font-weight: 800; fill: #FFFFFF; letter-spacing: 0.5px; }
    .subtitle-dc3 { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: #94A3B8; }
    .card-title-dc3 { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #F8FAFC; }
    .card-badge-dc3 { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 800; fill: #061830; letter-spacing: 1px; }
    .node-text-dc3 { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #CBD5E1; }
    .code-text-dc3 { font-family: 'Consolas', monospace; font-size: 11px; fill: #FFC809; }
    .bold-dc3 { font-weight: 700; fill: #FFFFFF; }
  </style>

  <!-- Background Layer -->
  <rect width="900" height="1350" fill="url(#dc3-bg-grad)"/>

  <!-- Page Margin Indicator (Folio Print Border Guide) -->
  <rect x="25" y="25" width="850" height="1300" rx="16" fill="none" stroke="#1E3A8A" stroke-width="1.5" stroke-dasharray="8,5"/>

  <!-- Header Banner (DC3 Style Printable Header) -->
  <g transform="translate(45, 45)">
    <rect x="0" y="0" width="810" height="85" rx="14" fill="#0F2440" stroke="#0066CC" stroke-width="1.5" filter="url(#dc3-shadow)"/>
    <text x="25" y="38" class="title-dc3">⚖️ PIPELINE DE ARQUITECTURA (DC3 CYBER CENTER STYLE)</text>
    <text x="25" y="62" class="subtitle-dc3">Formato Folio Imprimible • Estándar Institucional Department of Defense Cyber Crime Center</text>
    <rect x="610" y="25" width="175" height="35" rx="17" fill="url(#dc3-gold-grad)"/>
    <text x="697" y="47" text-anchor="middle" class="card-badge-dc3">DC3 CYBER FORENSICS LAB</text>
  </g>

  <!-- STEP 1: Configuración y Entradas -->
  <g transform="translate(45, 150)">
    <rect x="0" y="0" width="810" height="160" rx="14" fill="url(#dc3-card-grad)" stroke="#0066CC" stroke-width="2" filter="url(#dc3-shadow)"/>
    <rect x="15" y="15" width="6" height="130" rx="3" fill="url(#dc3-gold-grad)"/>
    
    <rect x="35" y="15" width="100" height="22" rx="11" fill="url(#dc3-gold-grad)"/>
    <text x="85" y="30" text-anchor="middle" class="card-badge-dc3">ETAPA 1</text>
    <text x="145" y="32" class="card-title-dc3">Configuración y Menú Táctico CLI (main.py / config.json)</text>

    <!-- Subcards -->
    <rect x="35" y="48" width="240" height="95" rx="8" fill="#061830" stroke="#1E3A8A"/>
    <text x="45" y="70" class="bold-dc3">1.1 Interfaz main.py</text>
    <text x="45" y="88" class="node-text-dc3">• Menú DC3 Táctico [1-6]</text>
    <text x="45" y="105" class="node-text-dc3">• Banderas CLI: -g, -u, -p</text>
    <text x="45" y="122" class="node-text-dc3">• ejecutable_extractor.bat</text>

    <rect x="290" y="48" width="240" height="95" rx="8" fill="#061830" stroke="#1E3A8A"/>
    <text x="300" y="70" class="bold-dc3">1.2 config.json</text>
    <text x="300" y="88" class="node-text-dc3">• Rango Años: 2019 - 2026</text>
    <text x="300" y="105" class="node-text-dc3">• Cobertura 7 Salas TSJ</text>
    <text x="300" y="122" class="node-text-dc3">• modo_tecnologia: True</text>

    <rect x="545" y="48" width="245" height="95" rx="8" fill="#061830" stroke="#1E3A8A"/>
    <text x="555" y="70" class="bold-dc3">1.3 Fórmulas de Búsqueda</text>
    <text x="555" y="88" class="node-text-dc3">• "Evidencia Digital"</text>
    <text x="555" y="105" class="node-text-dc3">• "Delito Informático"</text>
    <text x="555" y="122" class="node-text-dc3">• Expedientes (ej. C25-664)</text>
  </g>

  <!-- Arrow Down 1 -> 2 -->
  <path d="M 450 310 L 450 340" stroke="#FFC809" stroke-width="3" fill="none" marker-end="url(#dc3-arrow-gold)"/>

  <!-- STEP 2: Extracción HTTP & Conexión Portal TSJ -->
  <g transform="translate(45, 345)">
    <rect x="0" y="0" width="810" height="160" rx="14" fill="url(#dc3-card-grad)" stroke="#0066CC" stroke-width="2" filter="url(#dc3-shadow)"/>
    <rect x="15" y="15" width="6" height="130" rx="3" fill="url(#dc3-cyan-grad)"/>
    
    <rect x="35" y="15" width="100" height="22" rx="11" fill="url(#dc3-cyan-grad)"/>
    <text x="85" y="30" text-anchor="middle" class="card-badge-dc3">ETAPA 2</text>
    <text x="145" y="32" class="card-title-dc3">Scraping HTTP y Peticiones CiberTácticas al TSJ</text>

    <rect x="35" y="48" width="240" height="95" rx="8" fill="#061830" stroke="#1E3A8A"/>
    <text x="45" y="70" class="bold-dc3">2.1 Cliente HTTP</text>
    <text x="45" y="88" class="node-text-dc3">• requests + urllib3</text>
    <text x="45" y="105" class="node-text-dc3">• SSL verify=False (Bypass)</text>
    <text x="45" y="122" class="node-text-dc3">• User-Agent Chrome 126</text>

    <rect x="290" y="48" width="240" height="95" rx="8" fill="#061830" stroke="#1E3A8A"/>
    <text x="300" y="70" class="bold-dc3">2.2 Servidor TSJ</text>
    <text x="300" y="88" class="node-text-dc3">• historico.tsj.gob.ve</text>
    <text x="300" y="105" class="node-text-dc3">• Paginación Mensual 2019-26</text>
    <text x="300" y="122" class="node-text-dc3">• Mapeo de 7 Salas TSJ</text>

    <rect x="545" y="48" width="245" height="95" rx="8" fill="#061830" stroke="#00F2FE" stroke-width="1.5"/>
    <text x="555" y="70" class="bold-dc3" fill="#00F2FE">2.3 "Ver Extracto:" Pop-Up</text>
    <text x="555" y="88" class="node-text-dc3">• Detecta enlace under 📄</text>
    <text x="555" y="105" class="node-text-dc3">• Abre Sub-página Pop-Up</text>
    <text x="555" y="122" class="node-text-dc3">• Captura Ratio Decidendi</text>
  </g>

  <!-- Arrow Down 2 -> 3 -->
  <path d="M 450 505 L 450 535" stroke="#00F2FE" stroke-width="3" fill="none" marker-end="url(#dc3-arrow-cyan)"/>

  <!-- STEP 3: Parsing DOM, Filtro NLP & Normalización -->
  <g transform="translate(45, 540)">
    <rect x="0" y="0" width="810" height="160" rx="14" fill="url(#dc3-card-grad)" stroke="#0066CC" stroke-width="2" filter="url(#dc3-shadow)"/>
    <rect x="15" y="15" width="6" height="130" rx="3" fill="url(#dc3-gold-grad)"/>
    
    <rect x="35" y="15" width="100" height="22" rx="11" fill="url(#dc3-gold-grad)"/>
    <text x="85" y="30" text-anchor="middle" class="card-badge-dc3">ETAPA 3</text>
    <text x="145" y="32" class="card-title-dc3">Parsing DOM HTML &amp; Inteligencia en Evidencia Digital DC3</text>

    <rect x="35" y="48" width="240" height="95" rx="8" fill="#061830" stroke="#1E3A8A"/>
    <text x="45" y="70" class="bold-dc3">3.1 BeautifulSoup Parser</text>
    <text x="45" y="88" class="node-text-dc3">• Parser Lxml C-Engine</text>
    <text x="45" y="105" class="node-text-dc3">• Extrae: Exp, Sent, Fecha</text>
    <text x="45" y="122" class="node-text-dc3">• clean_text() de espacios</text>

    <rect x="290" y="48" width="240" height="95" rx="8" fill="#061830" stroke="#FFC809" stroke-width="1.5"/>
    <text x="300" y="70" class="bold-dc3" fill="#FFC809">3.2 TECH_KEYWORDS Filter</text>
    <text x="300" y="88" class="node-text-dc3">• Evidencia / Prueba Digital</text>
    <text x="300" y="105" class="node-text-dc3">• Cadena de Custodia / Hash</text>
    <text x="300" y="122" class="node-text-dc3">• Delito Informático / WhatsApp</text>

    <rect x="545" y="48" width="245" height="95" rx="8" fill="#061830" stroke="#1E3A8A"/>
    <text x="555" y="70" class="bold-dc3">3.3 Normalizador Nombres</text>
    <text x="555" y="88" class="code-text-dc3">sanitize_search_name()</text>
    <text x="555" y="105" class="node-text-dc3">• Genera sufijos limpios</text>
    <text x="555" y="122" class="node-text-dc3">• ej. Busqueda_Delitos...</text>
  </g>

  <!-- Arrow Down 3 -> 4 -->
  <path d="M 450 700 L 450 730" stroke="#38F9D7" stroke-width="3" fill="none" marker-end="url(#dc3-arrow-green)"/>

  <!-- STEP 4: Persistencia Emparejada 1:1 -->
  <g transform="translate(45, 735)">
    <rect x="0" y="0" width="810" height="175" rx="14" fill="url(#dc3-card-grad)" stroke="#38F9D7" stroke-width="2" filter="url(#dc3-shadow)"/>
    <rect x="15" y="15" width="6" height="145" rx="3" fill="url(#dc3-green-grad)"/>
    
    <rect x="35" y="15" width="100" height="22" rx="11" fill="url(#dc3-green-grad)"/>
    <text x="85" y="30" text-anchor="middle" class="card-badge-dc3">ETAPA 4</text>
    <text x="145" y="32" class="card-title-dc3">Persistencia Emparejada 1:1 (SQLite DB + Matriz Excel)</text>

    <rect x="35" y="48" width="365" height="110" rx="8" fill="#061830" stroke="#38F9D7" stroke-width="1.5"/>
    <text x="50" y="72" class="bold-dc3" fill="#38F9D7">🗄️ Base de Datos SQLite Dedicada</text>
    <text x="50" y="92" class="node-text-dc3">• Ruta: data/Databases_SQLite/&lt;Busqueda_Formula&gt;.db</text>
    <text x="50" y="110" class="node-text-dc3">• Inserción Atómica: ON CONFLICT(link_directo) DO UPDATE</text>
    <text x="50" y="128" class="node-text-dc3">• Cero duplicados, almacenamiento relacional indexado por sala y año</text>

    <rect x="420" y="48" width="370" height="110" rx="8" fill="#061830" stroke="#38F9D7" stroke-width="1.5"/>
    <text x="435" y="72" class="bold-dc3" fill="#38F9D7">📊 Matriz Analítica Excel Emparejada</text>
    <text x="435" y="92" class="node-text-dc3">• Ruta: data/Excel_Buscador/&lt;Busqueda_Formula&gt;.xlsx</text>
    <text x="435" y="110" class="node-text-dc3">• 9 Columnas de Datos estructurados + Extracto de Pop-Up</text>
    <text x="435" y="128" class="node-text-dc3">• Columna 9: Hipervínculo Azul Clicable de la URL que abrió Pop-Up</text>
  </g>

  <!-- Arrow Down 4 -> 5 -->
  <path d="M 450 910 L 450 940" stroke="#38F9D7" stroke-width="3" fill="none" marker-end="url(#dc3-arrow-green)"/>

  <!-- STEP 5: Salidas UX y PDF Institucional -->
  <g transform="translate(45, 945)">
    <rect x="0" y="0" width="810" height="160" rx="14" fill="url(#dc3-card-grad)" stroke="#0066CC" stroke-width="2" filter="url(#dc3-shadow)"/>
    <rect x="15" y="15" width="6" height="130" rx="3" fill="url(#dc3-gold-grad)"/>
    
    <rect x="35" y="15" width="100" height="22" rx="11" fill="url(#dc3-gold-grad)"/>
    <text x="85" y="30" text-anchor="middle" class="card-badge-dc3">ETAPA 5</text>
    <text x="145" y="32" class="card-title-dc3">Exportación de Documentos y Salidas UX Estilo DC3</text>

    <rect x="35" y="48" width="240" height="95" rx="8" fill="#061830" stroke="#1E3A8A"/>
    <text x="45" y="70" class="bold-dc3">5.1 PDF Oficial TSJ</text>
    <text x="45" y="88" class="node-text-dc3">• ReportLab Engine</text>
    <text x="45" y="105" class="node-text-dc3">• Membrete e Imprimible</text>
    <text x="45" y="122" class="node-text-dc3">• data/PDFs/</text>

    <rect x="290" y="48" width="240" height="95" rx="8" fill="#061830" stroke="#1E3A8A"/>
    <text x="300" y="70" class="bold-dc3">5.2 JSON / CSV Backups</text>
    <text x="300" y="88" class="node-text-dc3">• Resguardo de datos</text>
    <text x="300" y="105" class="node-text-dc3">• Integración con RAG/LLM</text>
    <text x="300" y="122" class="node-text-dc3">• Intercambio de APIs</text>

    <rect x="545" y="48" width="245" height="95" rx="8" fill="#061830" stroke="#FFC809" stroke-width="1.5"/>
    <text x="555" y="70" class="bold-dc3" fill="#FFC809">5.3 Consola DC3 &amp; Stats</text>
    <text x="555" y="88" class="node-text-dc3">• main.py --db (Reporte BDs)</text>
    <text x="555" y="105" class="node-text-dc3">• Menú Táctico Gold/Navy</text>
    <text x="555" y="122" class="node-text-dc3">• Sincronización GitHub</text>
  </g>

  <!-- Bottom Printable Summary Banner (DC3 Footer) -->
  <g transform="translate(45, 1125)">
    <rect x="0" y="0" width="810" height="175" rx="14" fill="#0F2440" stroke="#0066CC" stroke-width="1.5" filter="url(#dc3-shadow)"/>
    <text x="30" y="35" class="title-dc3" fill="#FFFFFF">📜 GARANTÍAS DE IMPRESIÓN Y GOBERNANZA CYBER CENTER DC3</text>

    <g transform="translate(30, 55)">
      <circle cx="12" cy="12" r="12" fill="url(#dc3-gold-grad)"/>
      <text x="12" y="16" text-anchor="middle" font-family="Segoe UI" font-size="11px" font-weight="800" fill="#061830">✓</text>
      <text x="32" y="16" font-family="Segoe UI" font-size="12px" font-weight="700" fill="#FFC809">Generación Emparejada 1:1:</text>
      <text x="210" y="16" font-family="Segoe UI" font-size="12px" fill="#94A3B8">Cada término de búsqueda crea un archivo SQLite (.db) y un Excel (.xlsx) con nombres espejo.</text>
    </g>

    <g transform="translate(30, 85)">
      <circle cx="12" cy="12" r="12" fill="url(#dc3-green-grad)"/>
      <text x="12" y="16" text-anchor="middle" font-family="Segoe UI" font-size="11px" font-weight="800" fill="#061830">✓</text>
      <text x="32" y="16" font-family="Segoe UI" font-size="12px" font-weight="700" fill="#38F9D7">Verificación Pop-Up:</text>
      <text x="210" y="16" font-family="Segoe UI" font-size="12px" fill="#94A3B8">Abre el link bajo 'Ver Extracto:', valida la ratio decidendi y guarda esa URL exacta como link_directo.</text>
    </g>

    <g transform="translate(30, 115)">
      <circle cx="12" cy="12" r="12" fill="url(#dc3-cyan-grad)"/>
      <text x="12" y="16" text-anchor="middle" font-family="Segoe UI" font-size="11px" font-weight="800" fill="#061830">✓</text>
      <text x="32" y="16" font-family="Segoe UI" font-size="12px" font-weight="700" fill="#00F2FE">Estándar Folio Vertical DC3:</text>
      <text x="210" y="16" font-family="Segoe UI" font-size="12px" fill="#94A3B8">Proporción de página Folio/Legal (900x1350) optimizada para lectura en papel e informes gubernamentales.</text>
    </g>

    <!-- Footer Code Line -->
    <rect x="30" y="138" width="750" height="26" rx="6" fill="#061830"/>
    <text x="45" y="155" class="code-text-dc3">DC3 Cyber Forensics Laboratory Style • Extractor TSJ Venezuela • GitHub: julljoll/case-law-extractor</text>
  </g>
</svg>
