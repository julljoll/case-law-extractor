<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1350" width="100%" height="100%">
  <defs>
    <!-- DC3 Navy Background Gradient -->
    <linearGradient id="dc3-bg-grad-sc" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#061830"/>
      <stop offset="50%" stop-color="#0A192F"/>
      <stop offset="100%" stop-color="#061830"/>
    </linearGradient>

    <!-- DC3 Card Fill Gradient -->
    <linearGradient id="dc3-card-grad-sc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F2440"/>
      <stop offset="100%" stop-color="#0A192F"/>
    </linearGradient>
    
    <!-- DC3 Gold Accent Gradient -->
    <linearGradient id="dc3-gold-grad-sc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFC809"/>
      <stop offset="100%" stop-color="#FFCC00"/>
    </linearGradient>

    <linearGradient id="dc3-cyan-grad-sc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <linearGradient id="dc3-green-grad-sc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38F9D7"/>
      <stop offset="100%" stop-color="#43E97B"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="dc3-shadow-sc">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Markers -->
    <marker id="dc3-arrow-down-cyan" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 0 L 5 10 L 9 0 z" fill="#00F2FE" />
    </marker>
    <marker id="dc3-arrow-down-gold" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 0 L 5 10 L 9 0 z" fill="#FFC809" />
    </marker>
    <marker id="dc3-arrow-down-green" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 0 L 5 10 L 9 0 z" fill="#38F9D7" />
    </marker>
  </defs>

  <style>
    .title-sc-dc3 { font-family: 'Times New Roman', Georgia, serif; font-size: 21px; font-weight: 800; fill: #FFFFFF; letter-spacing: 0.5px; }
    .subtitle-sc-dc3 { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: #94A3B8; }
    .card-title-sc-dc3 { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #F8FAFC; }
    .card-badge-sc-dc3 { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 800; fill: #061830; letter-spacing: 1px; }
    .node-text-sc-dc3 { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #CBD5E1; }
    .code-text-sc-dc3 { font-family: 'Consolas', monospace; font-size: 11px; fill: #FFC809; }
    .bold-sc-dc3 { font-weight: 700; fill: #FFFFFF; }
  </style>

  <!-- Background Layer -->
  <rect width="900" height="1350" fill="url(#dc3-bg-grad-sc)"/>

  <!-- Page Margin Indicator (Folio Print Border Guide) -->
  <rect x="25" y="25" width="850" height="1300" rx="16" fill="none" stroke="#1E3A8A" stroke-width="1.5" stroke-dasharray="8,5"/>

  <!-- Header Banner (DC3 Style Printable Header) -->
  <g transform="translate(45, 45)">
    <rect x="0" y="0" width="810" height="85" rx="14" fill="#0F2440" stroke="#0066CC" stroke-width="1.5" filter="url(#dc3-shadow-sc)"/>
    <text x="25" y="38" class="title-sc-dc3">🔍 LÓGICA DE EXTRACCIÓN Y POP-UP (DC3 CYBER STYLE)</text>
    <text x="25" y="62" class="subtitle-sc-dc3">Formato Folio Imprimible • Diagrama de Secuencia de Verificación y Copiado de URL</text>
    <rect x="610" y="25" width="175" height="35" rx="17" fill="url(#dc3-gold-grad-sc)"/>
    <text x="697" y="47" text-anchor="middle" class="card-badge-sc-dc3">DC3 CYBER FORENSICS LAB</text>
  </g>

  <!-- PASO 1: Escaneo en la Lista TSJ & Enlace Ver Extracto -->
  <g transform="translate(45, 150)">
    <rect x="0" y="0" width="810" height="160" rx="14" fill="url(#dc3-card-grad-sc)" stroke="#0066CC" stroke-width="2" filter="url(#dc3-shadow-sc)"/>
    <rect x="15" y="15" width="6" height="130" rx="3" fill="url(#dc3-cyan-grad-sc)"/>
    
    <rect x="35" y="15" width="100" height="22" rx="11" fill="url(#dc3-cyan-grad-sc)"/>
    <text x="85" y="30" text-anchor="middle" class="card-badge-sc-dc3">PASO 1</text>
    <text x="145" y="32" class="card-title-sc-dc3">Escaneo Inicial y Detección de Enlace "Ver Extracto:"</text>

    <rect x="35" y="48" width="240" height="95" rx="8" fill="#061830" stroke="#1E3A8A"/>
    <text x="45" y="70" class="bold-sc-dc3">1.1 Navegación TSJ</text>
    <text x="45" y="88" class="node-text-sc-dc3">• Apertura historico.tsj.gob.ve</text>
    <text x="45" y="105" class="node-text-sc-dc3">• Captura N° Sentencia y Exp</text>
    <text x="45" y="122" class="node-text-sc-dc3">• Lectura de Fecha y Sala</text>

    <rect x="290" y="48" width="250" height="95" rx="8" fill="#061830" stroke="#00F2FE" stroke-width="1.5"/>
    <text x="300" y="70" class="bold-sc-dc3" fill="#00F2FE">1.2 Enlace bajo "Ver Extracto:"</text>
    <text x="300" y="88" class="node-text-sc-dc3">• Detecta ícono de documento 📄</text>
    <text x="300" y="105" class="node-text-sc-dc3">• Identifica enlace HTML .HTM:</text>
    <text x="300" y="122" class="code-text-sc-dc3">&lt;a href="RH-...02870.HTM"&gt;</text>

    <rect x="555" y="48" width="235" height="95" rx="8" fill="#061830" stroke="#1E3A8A"/>
    <text x="565" y="70" class="bold-sc-dc3">1.3 Metadata Preliminar</text>
    <text x="565" y="88" class="node-text-sc-dc3">• Asunto en lista</text>
    <text x="565" y="105" class="node-text-sc-dc3">• Tema de casación</text>
    <text x="565" y="122" class="node-text-sc-dc3">• Materia asignada</text>
  </g>

  <!-- Arrow Down 1 -> 2 -->
  <path d="M 450 310 L 450 340" stroke="#00F2FE" stroke-width="3" fill="none" marker-end="url(#dc3-arrow-down-cyan)"/>

  <!-- PASO 2: Apertura del Link y Despliegue de Ventana Emergente Pop-Up -->
  <g transform="translate(45, 345)">
    <rect x="0" y="0" width="810" height="160" rx="14" fill="url(#dc3-card-grad-sc)" stroke="#0066CC" stroke-width="2" filter="url(#dc3-shadow-sc)"/>
    <rect x="15" y="15" width="6" height="130" rx="3" fill="url(#dc3-gold-grad-sc)"/>
    
    <rect x="35" y="15" width="100" height="22" rx="11" fill="url(#dc3-gold-grad-sc)"/>
    <text x="85" y="30" text-anchor="middle" class="card-badge-sc-dc3">PASO 2</text>
    <text x="145" y="32" class="card-title-sc-dc3">Apertura del Link y Despliegue del Pop-Up Imprimible</text>

    <rect x="35" y="48" width="240" height="95" rx="8" fill="#061830" stroke="#FFC809" stroke-width="1.5"/>
    <text x="45" y="70" class="bold-sc-dc3" fill="#FFC809">2.1 Petición HTTP GET</text>
    <text x="45" y="88" class="node-text-sc-dc3">• Abre la URL que sale debajo</text>
    <text x="45" y="105" class="node-text-sc-dc3">  de "Ver Extracto:"</text>
    <text x="45" y="122" class="code-text-sc-dc3">fetch_url(popup_url)</text>

    <rect x="290" y="48" width="250" height="95" rx="8" fill="#061830" stroke="#1E3A8A"/>
    <text x="300" y="70" class="bold-sc-dc3">2.2 Ventana Emergente</text>
    <text x="300" y="88" class="node-text-sc-dc3">• Render de la vista imprimible</text>
    <text x="300" y="105" class="node-text-sc-dc3">• Encabezado oficial TSJ</text>
    <text x="300" y="122" class="node-text-sc-dc3">• Botón [IMPRIMIR DOCUMENTO]</text>

    <rect x="555" y="48" width="235" height="95" rx="8" fill="#061830" stroke="#1E3A8A"/>
    <text x="565" y="70" class="bold-sc-dc3">2.3 Parsing del Modal</text>
    <text x="565" y="88" class="node-text-sc-dc3">• Parse del texto del Pop-Up</text>
    <text x="565" y="105" class="node-text-sc-dc3">• Captura extracto completo</text>
    <text x="565" y="122" class="node-text-sc-dc3">• Ponente y Ratio Decidendi</text>
  </g>

  <!-- Arrow Down 2 -> 3 -->
  <path d="M 450 505 L 450 535" stroke="#FFC809" stroke-width="3" fill="none" marker-end="url(#dc3-arrow-down-gold)"/>

  <!-- PASO 3: Verificación de Relevancia del Contenido -->
  <g transform="translate(45, 540)">
    <rect x="0" y="0" width="810" height="160" rx="14" fill="url(#dc3-card-grad-sc)" stroke="#0066CC" stroke-width="2" filter="url(#dc3-shadow-sc)"/>
    <rect x="15" y="15" width="6" height="130" rx="3" fill="url(#dc3-gold-grad-sc)"/>
    
    <rect x="35" y="15" width="100" height="22" rx="11" fill="url(#dc3-gold-grad-sc)"/>
    <text x="85" y="30" text-anchor="middle" class="card-badge-sc-dc3">PASO 3</text>
    <text x="145" y="32" class="card-title-sc-dc3">Verificación de Relevancia DC3 (Extracto Pop-Up &amp; Evidencia Digital)</text>

    <rect x="35" y="48" width="240" height="95" rx="8" fill="#061830" stroke="#FFC809" stroke-width="1.5"/>
    <text x="45" y="70" class="bold-sc-dc3" fill="#FFC809">3.1 Filtro TECH_KEYWORDS</text>
    <text x="45" y="88" class="node-text-sc-dc3">• "evidencia digital", "hash"</text>
    <text x="45" y="105" class="node-text-sc-dc3">• "delito informático"</text>
    <text x="45" y="122" class="node-text-sc-dc3">• "cadena de custodia"</text>

    <rect x="290" y="48" width="250" height="95" rx="8" fill="#061830" stroke="#1E3A8A"/>
    <text x="300" y="70" class="bold-sc-dc3">3.2 Limpieza Textual</text>
    <text x="300" y="88" class="code-text-sc-dc3">clean_text(extracto_popup)</text>
    <text x="300" y="105" class="node-text-sc-dc3">• Elimina etiquetas HTML</text>
    <text x="300" y="122" class="node-text-sc-dc3">• Normalización UTF-8</text>

    <rect x="555" y="48" width="235" height="95" rx="8" fill="#061830" stroke="#1E3A8A"/>
    <text x="565" y="70" class="bold-sc-dc3">3.3 Validación de Fallo</text>
    <text x="565" y="88" class="node-text-sc-dc3">✓ Ratio Decidendi válida</text>
    <text x="565" y="105" class="node-text-sc-dc3">✓ Aprobado para copiado</text>
    <text x="565" y="122" class="node-text-sc-dc3">  y almacenamiento</text>
  </g>

  <!-- Arrow Down 3 -> 4 -->
  <path d="M 450 700 L 450 730" stroke="#38F9D7" stroke-width="3" fill="none" marker-end="url(#dc3-arrow-down-green)"/>

  <!-- PASO 4: Copiado de la URL del Pop-Up como link_directo -->
  <g transform="translate(45, 735)">
    <rect x="0" y="0" width="810" height="160" rx="14" fill="url(#dc3-card-grad-sc)" stroke="#38F9D7" stroke-width="2" filter="url(#dc3-shadow-sc)"/>
    <rect x="15" y="15" width="6" height="130" rx="3" fill="url(#dc3-green-grad-sc)"/>
    
    <rect x="35" y="15" width="100" height="22" rx="11" fill="url(#dc3-green-grad-sc)"/>
    <text x="85" y="30" text-anchor="middle" class="card-badge-sc-dc3">PASO 4</text>
    <text x="145" y="32" class="card-title-sc-dc3">Copiado del Enlace Oficial del Pop-Up (link_directo)</text>

    <rect x="35" y="48" width="365" height="95" rx="8" fill="#061830" stroke="#38F9D7" stroke-width="1.5"/>
    <text x="50" y="70" class="bold-sc-dc3" fill="#38F9D7">4.1 Asignación de la URL Verificada</text>
    <text x="50" y="88" class="node-text-sc-dc3">• Copia la URL exacta que desplegó la ventana emergente:</text>
    <text x="50" y="108" class="code-text-sc-dc3">decision['link_directo'] = popup_url</text>
    <text x="50" y="125" class="node-text-sc-dc3">• Garantía: Cero enlaces rotos o discrepancias</text>

    <rect x="420" y="48" width="370" height="95" rx="8" fill="#061830" stroke="#38F9D7" stroke-width="1.5"/>
    <text x="435" y="70" class="bold-sc-dc3" fill="#38F9D7">4.2 Sanitización del Nombre de la Búsqueda</text>
    <text x="435" y="88" class="code-text-sc-dc3">name = sanitize_search_name(formula_busqueda)</text>
    <text x="435" y="108" class="node-text-sc-dc3">• Asigna nombre espejo a la BD SQLite y a la Matriz Excel</text>
    <text x="435" y="125" class="node-text-sc-dc3">• ej. Busqueda_Delitos_Informaticos</text>
  </g>

  <!-- Arrow Down 4 -> 5 -->
  <path d="M 450 895 L 450 925" stroke="#38F9D7" stroke-width="3" fill="none" marker-end="url(#dc3-arrow-down-green)"/>

  <!-- PASO 5: Almacenamiento Emparejado en BD SQLite y Excel -->
  <g transform="translate(45, 930)">
    <rect x="0" y="0" width="810" height="175" rx="14" fill="url(#dc3-card-grad-sc)" stroke="#38F9D7" stroke-width="2" filter="url(#dc3-shadow-sc)"/>
    <rect x="15" y="15" width="6" height="145" rx="3" fill="url(#dc3-green-grad-sc)"/>
    
    <rect x="35" y="15" width="100" height="22" rx="11" fill="url(#dc3-green-grad-sc)"/>
    <text x="85" y="30" text-anchor="middle" class="card-badge-sc-dc3">PASO 5</text>
    <text x="145" y="32" class="card-title-sc-dc3">Persistencia Emparejada 1:1 (SQLite DB + Matriz Excel)</text>

    <rect x="35" y="48" width="365" height="110" rx="8" fill="#061830" stroke="#38F9D7" stroke-width="1.5"/>
    <text x="50" y="72" class="bold-sc-dc3" fill="#38F9D7">🗄️ SQLite DB Dedicada</text>
    <text x="50" y="92" class="node-text-sc-dc3">• Guarda link_directo + extracto verificado del Pop-Up</text>
    <text x="50" y="110" class="code-text-sc-dc3">INSERT INTO decisiones ON CONFLICT(link_directo)...</text>
    <text x="50" y="128" class="node-text-sc-dc3">• data/Databases_SQLite/&lt;Busqueda_Formula&gt;.db</text>

    <rect x="420" y="48" width="370" height="110" rx="8" fill="#061830" stroke="#38F9D7" stroke-width="1.5"/>
    <text x="435" y="72" class="bold-sc-dc3" fill="#38F9D7">📊 Excel Emparejado (.xlsx)</text>
    <text x="435" y="92" class="node-text-sc-dc3">• Columna 8: Extracto Pop-Up | Columna 9: Link Directo</text>
    <text x="435" y="110" class="node-text-sc-dc3">• Hipervínculo azul clicable para abrir la sentencia oficial</text>
    <text x="435" y="128" class="node-text-sc-dc3">• data/Excel_Buscador/&lt;Busqueda_Formula&gt;.xlsx</text>
  </g>

  <!-- Bottom Code Sequence Summary (DC3 Footer) -->
  <g transform="translate(45, 1120)">
    <rect x="0" y="0" width="810" height="180" rx="14" fill="#0F2440" stroke="#0066CC" stroke-width="1.5" filter="url(#dc3-shadow-sc)"/>
    <text x="30" y="35" class="title-sc-dc3" fill="#FFFFFF">⚡ SECUENCIA DE CÓDIGO PYTHON (EXTRACCIÓN &amp; GUARDA DE POP-UP)</text>

    <rect x="30" y="52" width="245" height="110" rx="8" fill="#061830" stroke="#1E3A8A"/>
    <text x="40" y="74" font-weight="700" fill="#00F2FE" font-size="11px" font-family="Segoe UI">1. Captura Link Lista</text>
    <text x="40" y="94" class="code-text-sc-dc3">link_popup = row.find(</text>
    <text x="40" y="110" class="code-text-sc-dc3">  'a', text=re.compile('HTM')</text>
    <text x="40" y="126" class="code-text-sc-dc3">)['href']</text>

    <rect x="290" y="52" width="250" height="110" rx="8" fill="#061830" stroke="#1E3A8A"/>
    <text x="300" y="74" font-weight="700" fill="#FFC809" font-size="11px" font-family="Segoe UI">2. Verificación Pop-Up</text>
    <text x="300" y="94" class="code-text-sc-dc3">html = fetch_url(link_popup)</text>
    <text x="300" y="110" class="code-text-sc-dc3">extracto = parse(html)</text>
    <text x="300" y="126" class="code-text-sc-dc3">decision['link'] = link_popup</text>

    <rect x="555" y="52" width="225" height="110" rx="8" fill="#061830" stroke="#1E3A8A"/>
    <text x="565" y="74" font-weight="700" fill="#38F9D7" font-size="11px" font-family="Segoe UI">3. Guardado Emparejado</text>
    <text x="565" y="94" class="code-text-sc-dc3">db.insertar(decision)</text>
    <text x="565" y="110" class="code-text-sc-dc3">export_excel(decision)</text>
    <text x="565" y="126" class="code-text-sc-dc3"># Cero discrepancias</text>

    <rect x="30" y="145" width="750" height="22" rx="4" fill="#061830"/>
    <text x="40" y="160" class="code-text-sc-dc3">DC3 Cyber Forensics Laboratory Style • Extractor TSJ Venezuela • Standard Folio Vertical Print Format</text>
  </g>
</svg>
