<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 980" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-scraper" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    
    <linearGradient id="cyan-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <linearGradient id="green-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38F9D7"/>
      <stop offset="100%" stop-color="#43E97B"/>
    </linearGradient>

    <linearGradient id="purple-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F355DA"/>
      <stop offset="100%" stop-color="#6E0DD0"/>
    </linearGradient>

    <linearGradient id="amber-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="shadow-effect">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Markers -->
    <marker id="arrow-cyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#00F2FE" />
    </marker>
    <marker id="arrow-amber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#FFB300" />
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38F9D7" />
    </marker>
  </defs>

  <style>
    .header-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 25px; font-weight: 800; fill: #FFFFFF; letter-spacing: 1px; }
    .header-subtitle { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: #8D99AE; }
    .phase-title { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #F8FAFC; }
    .phase-badge { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 800; fill: #0B132B; text-transform: uppercase; letter-spacing: 1px; }
    .code-box { font-family: 'Consolas', monospace; font-size: 11px; fill: #38F9D7; }
    .text-dim { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #CBD5E1; }
    .text-bold { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; font-weight: 700; fill: #FFFFFF; }
    .highlight-yellow { fill: #FFB300; font-weight: 700; }
  </style>

  <!-- Background -->
  <rect width="1400" height="980" fill="url(#bg-grad-scraper)"/>

  <!-- Top Banner -->
  <g transform="translate(50, 40)">
    <rect x="0" y="0" width="1300" height="75" rx="16" fill="#1C2541" stroke="#3A506B" stroke-width="1.5" filter="url(#shadow-effect)"/>
    <text x="30" y="38" class="header-title">🔍 LÓGICA DE EXTRACCIÓN Y FLUJO DEL SCRAPER ("VER EXTRACTO" TSJ)</text>
    <text x="30" y="60" class="header-subtitle">Secuencia exacta: Escaneo ➔ Identificación Link "Ver Extracto" ➔ Apertura Pop-Up ➔ Verificación Contenido ➔ Copiado de URL a BD/Excel</text>
    <rect x="1120" y="20" width="150" height="35" rx="8" fill="url(#cyan-glow)"/>
    <text x="1195" y="42" text-anchor="middle" class="phase-badge">VERIFIED PIPELINE</text>
  </g>

  <!-- Flow Steps Grid (5 Columns) -->

  <!-- STEP A: Escaneo Inicial Lista TSJ -->
  <g transform="translate(50, 155)">
    <rect x="0" y="0" width="230" height="520" rx="16" fill="url(#card-grad)" stroke="#3A506B" stroke-width="2" filter="url(#shadow-effect)"/>
    <rect x="15" y="15" width="200" height="6" rx="3" fill="url(#cyan-glow)"/>
    
    <rect x="15" y="30" width="80" height="22" rx="4" fill="url(#cyan-glow)"/>
    <text x="55" y="45" text-anchor="middle" class="phase-badge">PASO 1</text>
    <text x="15" y="75" class="phase-title">Escaneo Lista TSJ</text>

    <!-- Content Nodes -->
    <rect x="15" y="95" width="200" height="120" rx="10" fill="#0B132B" stroke="#3A506B"/>
    <text x="25" y="118" class="text-bold">1. Navegación &amp; Lista</text>
    <text x="25" y="138" class="text-dim">• Apertura servidor TSJ</text>
    <text x="25" y="155" class="text-dim">• Recorrido bloques por fecha</text>
    <text x="25" y="172" class="text-dim">• Captura N° Expediente</text>
    <text x="25" y="189" class="text-dim">• Captura N° Sentencia</text>

    <rect x="15" y="230" width="200" height="150" rx="10" fill="#0B132B" stroke="#00F2FE" stroke-width="1.5"/>
    <text x="25" y="253" class="text-bold" fill="#00F2FE">2. Enlace "Ver Extracto:"</text>
    <text x="25" y="273" class="text-dim">• Detecta etiqueta HTML:</text>
    <text x="25" y="290" class="code-text">&lt;a href="...HTM"&gt;</text>
    <text x="25" y="310" class="text-dim">• Icono documento 📄</text>
    <text x="25" y="330" class="text-dim">• URL debajo de "Ver Extracto"</text>
    <text x="25" y="350" class="code-text">RH-0017-280203-02870.HTM</text>

    <rect x="15" y="395" width="200" height="105" rx="10" fill="#0B132B" stroke="#3A506B"/>
    <text x="25" y="418" class="text-bold">3. Extracción Inicial</text>
    <text x="25" y="438" class="text-dim">• Tema preliminar</text>
    <text x="25" y="455" class="text-dim">• Materia preliminar</text>
    <text x="25" y="472" class="text-dim">• Asunto en lista</text>
  </g>

  <!-- Connection A -> B -->
  <path d="M 280 415 L 310 415" stroke="#00F2FE" stroke-width="3" fill="none" marker-end="url(#arrow-cyan)"/>

  <!-- STEP B: Apertura Link & Despliegue Pop-Up -->
  <g transform="translate(320, 155)">
    <rect x="0" y="0" width="230" height="520" rx="16" fill="url(#card-grad)" stroke="#3A506B" stroke-width="2" filter="url(#shadow-effect)"/>
    <rect x="15" y="15" width="200" height="6" rx="3" fill="url(#amber-glow)"/>
    
    <rect x="15" y="30" width="80" height="22" rx="4" fill="url(#amber-glow)"/>
    <text x="55" y="45" text-anchor="middle" class="phase-badge">PASO 2</text>
    <text x="15" y="75" class="phase-title">Apertura Pop-Up</text>

    <rect x="15" y="95" width="200" height="130" rx="10" fill="#0B132B" stroke="#FFB300" stroke-width="1.5"/>
    <text x="25" y="118" class="text-bold" fill="#FFB300">1. Petición URL Pop-Up</text>
    <text x="25" y="138" class="text-dim">• Abre el link exacto que</text>
    <text x="25" y="155" class="text-dim">  sale bajo "Ver Extracto"</text>
    <text x="25" y="172" class="text-dim">• HTTP GET a la sub-página</text>
    <text x="25" y="189" class="code-text">historico.tsj.gob.ve/...</text>
    <text x="25" y="206" class="text-dim">• Reintentos &amp; SSL Bypass</text>

    <rect x="15" y="240" width="200" height="140" rx="10" fill="#0B132B" stroke="#3A506B"/>
    <text x="25" y="263" class="text-bold">2. Despliegue Emergente</text>
    <text x="25" y="283" class="text-dim">• Render de vista imprimible</text>
    <text x="25" y="300" class="text-dim">• Encabezado República</text>
    <text x="25" y="317" class="text-dim">• Cuadro de Metadata</text>
    <text x="25" y="334" class="text-dim">• Botón superior [IMPRIMIR]</text>
    <text x="25" y="351" class="text-dim">• Texto del Fallo Completo</text>

    <rect x="15" y="395" width="200" height="105" rx="10" fill="#0B132B" stroke="#3A506B"/>
    <text x="25" y="418" class="text-bold">3. Parsing Modal HTML</text>
    <text x="25" y="438" class="text-dim">• Parse del cuerpo del Pop-Up</text>
    <text x="25" y="455" class="text-dim">• Captura de extracto real</text>
    <text x="25" y="472" class="text-dim">• Magistrado Ponente</text>
  </g>

  <!-- Connection B -> C -->
  <path d="M 550 415 L 580 415" stroke="#FFB300" stroke-width="3" fill="none" marker-end="url(#arrow-amber)"/>

  <!-- STEP C: Verificación de Relevancia del Contenido -->
  <g transform="translate(590, 155)">
    <rect x="0" y="0" width="230" height="520" rx="16" fill="url(#card-grad)" stroke="#3A506B" stroke-width="2" filter="url(#shadow-effect)"/>
    <rect x="15" y="15" width="200" height="6" rx="3" fill="url(#purple-glow)"/>
    
    <rect x="15" y="30" width="80" height="22" rx="4" fill="url(#purple-glow)"/>
    <text x="55" y="45" text-anchor="middle" class="phase-badge" style="fill:#FFFFFF">PASO 3</text>
    <text x="15" y="75" class="phase-title">Verificación Relevancia</text>

    <rect x="15" y="95" width="200" height="145" rx="10" fill="#0B132B" stroke="#F355DA" stroke-width="1.5"/>
    <text x="25" y="118" class="text-bold" fill="#F355DA">1. Filtro NLP &amp; Términos</text>
    <text x="25" y="138" class="text-dim">• Analiza extracto Pop-Up</text>
    <text x="25" y="155" class="text-dim">• Coincidencia palabra clave</text>
    <text x="25" y="172" class="text-dim">• "evidencia digital"</text>
    <text x="25" y="189" class="text-dim">• "peritaje informático"</text>
    <text x="25" y="206" class="text-dim">• "cadena de custodia"</text>
    <text x="25" y="223" class="text-dim">• Ratio Decidendi relevante</text>

    <rect x="15" y="250" width="200" height="120" rx="10" fill="#0B132B" stroke="#3A506B"/>
    <text x="25" y="273" class="text-bold">2. Normalización Texto</text>
    <text x="25" y="293" class="code-text">clean_text(extracto)</text>
    <text x="25" y="310" class="text-dim">• Elimina etiquetas HTML</text>
    <text x="25" y="327" class="text-dim">• Elimina espacios nulos</text>
    <text x="25" y="344" class="text-dim">• Codificación UTF-8 limpia</text>

    <rect x="15" y="380" width="200" height="120" rx="10" fill="#0B132B" stroke="#3A506B"/>
    <text x="25" y="403" class="text-bold">3. Validación de Caso</text>
    <text x="25" y="423" class="text-dim">✓ Registro validado como</text>
    <text x="25" y="440" class="text-dim">  jurisprudencia oficial</text>
    <text x="25" y="457" class="text-dim">✓ Listo para asignación</text>
    <text x="25" y="474" class="text-dim">  de enlace y guardado</text>
  </g>

  <!-- Connection C -> D -->
  <path d="M 820 415 L 850 415" stroke="#38F9D7" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>

  <!-- STEP D: Copiado de Link Directo Pop-Up -->
  <g transform="translate(860, 155)">
    <rect x="0" y="0" width="230" height="520" rx="16" fill="url(#card-grad)" stroke="#3A506B" stroke-width="2" filter="url(#shadow-effect)"/>
    <rect x="15" y="15" width="200" height="6" rx="3" fill="url(#green-glow)"/>
    
    <rect x="15" y="30" width="80" height="22" rx="4" fill="url(#green-glow)"/>
    <text x="55" y="45" text-anchor="middle" class="phase-badge">PASO 4</text>
    <text x="15" y="75" class="phase-title">Copiado Link Pop-Up</text>

    <rect x="15" y="95" width="200" height="150" rx="10" fill="#0B132B" stroke="#38F9D7" stroke-width="2"/>
    <text x="25" y="118" class="text-bold" fill="#38F9D7">1. Asignación URL Exacta</text>
    <text x="25" y="138" class="text-dim">• Copia el enlace oficial</text>
    <text x="25" y="155" class="text-dim">  que abrió el Pop-Up:</text>
    <text x="25" y="175" class="code-text">decision['link_directo'] =</text>
    <text x="25" y="195" class="code-text">"https://historico.tsj..."</text>
    <text x="25" y="215" class="text-dim">• Enlace 100% verificado</text>
    <text x="25" y="232" class="text-dim">• Garantía de apertura</text>

    <rect x="15" y="255" width="200" height="115" rx="10" fill="#0B132B" stroke="#3A506B"/>
    <text x="25" y="278" class="text-bold">2. Sanitizador Nombre BD</text>
    <text x="25" y="298" class="code-text">sanitize_search_name()</text>
    <text x="25" y="315" class="text-dim">• Asigna nombre a BD y Excel</text>
    <text x="25" y="332" class="text-dim">• Según la consulta/fórmula</text>
    <text x="25" y="349" class="text-dim">  (ej. Busqueda_Delitos...)</text>

    <rect x="15" y="380" width="200" height="120" rx="10" fill="#0B132B" stroke="#3A506B"/>
    <text x="25" y="403" class="text-bold">3. Preparación de Lote</text>
    <text x="25" y="423" class="text-dim">• Diccionario completo:</text>
    <text x="25" y="440" class="text-dim">  [sala, exp, sent, fecha,</text>
    <text x="25" y="457" class="text-dim">   tema, materia, extracto,</text>
    <text x="25" y="474" class="code-text">   link_directo]</text>
  </g>

  <!-- Connection D -> E -->
  <path d="M 1090 415 L 1120 415" stroke="#38F9D7" stroke-width="3" fill="none" marker-end="url(#arrow-green)"/>

  <!-- STEP E: Almacenamiento Emparejado 1:1 -->
  <g transform="translate(1130, 155)">
    <rect x="0" y="0" width="220" height="520" rx="16" fill="url(#card-grad)" stroke="#3A506B" stroke-width="2" filter="url(#shadow-effect)"/>
    <rect x="15" y="15" width="190" height="6" rx="3" fill="url(#green-glow)"/>
    
    <rect x="15" y="30" width="80" height="22" rx="4" fill="url(#green-glow)"/>
    <text x="55" y="45" text-anchor="middle" class="phase-badge">PASO 5</text>
    <text x="15" y="75" class="phase-title">Persistencia 1:1</text>

    <rect x="15" y="95" width="190" height="165" rx="10" fill="#0B132B" stroke="#38F9D7" stroke-width="1.5"/>
    <text x="25" y="118" class="text-bold" style="fill:#38F9D7">🗄️ SQLite DB Dedicada</text>
    <text x="25" y="138" class="code-text">INSERT INTO decisiones</text>
    <text x="25" y="155" class="code-text">ON CONFLICT(link_directo)</text>
    <text x="25" y="172" class="code-text">DO UPDATE SET...</text>
    <text x="25" y="192" class="text-dim">• Guarda link_directo</text>
    <text x="25" y="209" class="text-dim">• Guarda extracto Pop-Up</text>
    <text x="25" y="226" class="text-dim">• Cero duplicados</text>
    <text x="25" y="243" class="text-dim">• Persistencia relacional</text>

    <rect x="15" y="270" width="190" height="175" rx="10" fill="#0B132B" stroke="#38F9D7" stroke-width="1.5"/>
    <text x="25" y="293" class="text-bold" style="fill:#38F9D7">📊 Excel Emparejado</text>
    <text x="25" y="313" class="code-text">export_excel_profesional()</text>
    <text x="25" y="333" class="text-dim">• Columna 9: Link Directo</text>
    <text x="25" y="350" class="text-dim">• Hipervínculo azul clicable</text>
    <text x="25" y="367" class="text-dim">• Columna 8: Extracto Pop-Up</text>
    <text x="25" y="384" class="text-dim">• Nombre: &lt;Formula&gt;.xlsx</text>
    <text x="25" y="401" class="text-dim">• 1:1 con &lt;Formula&gt;.db</text>
    <text x="25" y="428" class="code-text">openpyxl formatting</text>

    <rect x="15" y="455" width="190" height="50" rx="8" fill="url(#green-glow)"/>
    <text x="110" y="485" text-anchor="middle" font-family="Segoe UI" font-size="13px" font-weight="800" fill="#0B132B">✓ ENLACE &amp; POP-UP OK</text>
  </g>

  <!-- Bottom Code Sequence -->
  <g transform="translate(50, 700)">
    <rect x="0" y="0" width="1300" height="230" rx="16" fill="#1C2541" stroke="#3A506B" stroke-width="1.5" filter="url(#shadow-effect)"/>
    
    <text x="30" y="35" font-family="Segoe UI" font-size="15px" font-weight="700" fill="#F8FAFC">📌 VERIFICACIÓN DE SECUENCIA: DESDE LA LISTA DE VER EXTRACTO HASTA EL ALMACENAMIENTO DE LA URL</text>

    <rect x="30" y="55" width="390" height="150" rx="10" fill="#0B132B" stroke="#3A506B"/>
    <text x="45" y="80" class="text-bold" fill="#00F2FE">1. Captura del Link en la Lista TSJ</text>
    <text x="45" y="102" class="code-text"># Captura URL debajo de "Ver Extracto:"</text>
    <text x="45" y="122" class="code-text">link_popup = row.find('a', text=re.compile('HTM'))['href']</text>
    <text x="45" y="142" class="code-text"># Ejemplo:</text>
    <text x="45" y="162" class="code-text"># https://historico.tsj.gob.ve/.../RH-0017...HTM</text>

    <rect x="445" y="55" width="410" height="150" rx="10" fill="#0B132B" stroke="#3A506B"/>
    <text x="460" y="80" class="text-bold" fill="#FFB300">2. Apertura Pop-Up &amp; Verificación</text>
    <text x="460" y="102" class="code-text">popup_html = fetch_url(link_popup)</text>
    <text x="460" y="122" class="code-text">extracto_text = parse_popup_extract(popup_html)</text>
    <text x="460" y="142" class="code-text">if es_relevante(extracto_text, palabra_clave):</text>
    <text x="460" y="162" class="code-text">    decision['link_directo'] = link_popup</text>

    <rect x="885" y="55" width="385" height="150" rx="10" fill="#0B132B" stroke="#3A506B"/>
    <text x="900" y="80" class="text-bold" fill="#38F9D7">3. Registro Guardado en BD &amp; Excel</text>
    <text x="900" y="102" class="code-text"># Guarda URL que abrió el Pop-up</text>
    <text x="900" y="122" class="code-text">sqlite_db.insertar_o_actualizar(decision)</text>
    <text x="900" y="142" class="code-text">excel_writer.write_row(decision)</text>
    <text x="900" y="162" class="code-text"># Cero discrepancias en enlaces</text>
  </g>

</svg>
