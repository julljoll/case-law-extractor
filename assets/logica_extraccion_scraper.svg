<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 1350" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad-scraper-v" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0B132B"/>
      <stop offset="50%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="card-grad-sc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1C2541"/>
      <stop offset="100%" stop-color="#0B132B"/>
    </linearGradient>
    
    <linearGradient id="cyan-glow-sc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#4FACFE"/>
    </linearGradient>

    <linearGradient id="amber-glow-sc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFB300"/>
      <stop offset="100%" stop-color="#F57C00"/>
    </linearGradient>

    <linearGradient id="purple-glow-sc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F355DA"/>
      <stop offset="100%" stop-color="#6E0DD0"/>
    </linearGradient>

    <linearGradient id="green-glow-sc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38F9D7"/>
      <stop offset="100%" stop-color="#43E97B"/>
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow-sc">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.6"/>
    </filter>

    <!-- Marker Arrow Down -->
    <marker id="arrow-down-cyan" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 0 L 5 10 L 9 0 z" fill="#00F2FE" />
    </marker>
    <marker id="arrow-down-amber" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 0 L 5 10 L 9 0 z" fill="#FFB300" />
    </marker>
    <marker id="arrow-down-purple" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 0 L 5 10 L 9 0 z" fill="#F355DA" />
    </marker>
    <marker id="arrow-down-green" viewBox="0 0 10 10" refX="5" refY="6" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 1 0 L 5 10 L 9 0 z" fill="#38F9D7" />
    </marker>
  </defs>

  <style>
    .title-sc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 21px; font-weight: 800; fill: #FFFFFF; letter-spacing: 0.5px; }
    .subtitle-sc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 13px; font-weight: 500; fill: #8D99AE; }
    .card-title-sc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 15px; font-weight: 700; fill: #F8FAFC; }
    .card-badge-sc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 11px; font-weight: 800; fill: #0B132B; letter-spacing: 1px; }
    .node-text-sc { font-family: 'Segoe UI', system-ui, sans-serif; font-size: 12px; fill: #CBD5E1; }
    .code-text-sc { font-family: 'Consolas', monospace; font-size: 11px; fill: #38F9D7; }
    .bold-sc { font-weight: 700; fill: #FFFFFF; }
  </style>

  <!-- Background Layer -->
  <rect width="900" height="1350" fill="url(#bg-grad-scraper-v)"/>

  <!-- Page Margin Indicator (Folio Print Border Guide) -->
  <rect x="25" y="25" width="850" height="1300" rx="16" fill="none" stroke="#3A506B" stroke-width="1.5" stroke-dasharray="8,5"/>

  <!-- Header Banner (Printable Folio Header) -->
  <g transform="translate(45, 45)">
    <rect x="0" y="0" width="810" height="85" rx="14" fill="#1C2541" stroke="#3A506B" stroke-width="1.5" filter="url(#shadow-sc)"/>
    <text x="25" y="38" class="title-sc">🔍 FLUJO DE EXTRACCIÓN Y POP-UP ("VER EXTRACTO")</text>
    <text x="25" y="62" class="subtitle-sc">Formato Folio Imprimible • Diagrama Secuencial de Verificación y Copiado de URL</text>
    <rect x="630" y="25" width="155" height="35" rx="8" fill="url(#cyan-glow-sc)"/>
    <text x="707" y="47" text-anchor="middle" class="card-badge-sc">SCRAPER ENGINE</text>
  </g>

  <!-- PASO 1: Escaneo en la Lista TSJ & Enlace Ver Extracto -->
  <g transform="translate(45, 150)">
    <rect x="0" y="0" width="810" height="160" rx="14" fill="url(#card-grad-sc)" stroke="#3A506B" stroke-width="2" filter="url(#shadow-sc)"/>
    <rect x="15" y="15" width="6" height="130" rx="3" fill="url(#cyan-glow-sc)"/>
    
    <rect x="35" y="15" width="100" height="22" rx="4" fill="url(#cyan-glow-sc)"/>
    <text x="85" y="30" text-anchor="middle" class="card-badge-sc">PASO 1</text>
    <text x="145" y="32" class="card-title-sc">Escaneo Inicial y Detección de Enlace "Ver Extracto:"</text>

    <rect x="35" y="48" width="240" height="95" rx="8" fill="#0B132B" stroke="#3A506B"/>
    <text x="45" y="70" class="bold-sc">1.1 Navegación TSJ</text>
    <text x="45" y="88" class="node-text-sc">• Apertura historico.tsj.gob.ve</text>
    <text x="45" y="105" class="node-text-sc">• Captura N° Sentencia y Exp</text>
    <text x="45" y="122" class="node-text-sc">• Lectura de Fecha y Sala</text>

    <rect x="290" y="48" width="250" height="95" rx="8" fill="#0B132B" stroke="#00F2FE" stroke-width="1.5"/>
    <text x="300" y="70" class="bold-sc" fill="#00F2FE">1.2 Enlace bajo "Ver Extracto:"</text>
    <text x="300" y="88" class="node-text-sc">• Detecta ícono de documento 📄</text>
    <text x="300" y="105" class="node-text-sc">• Identifica enlace HTML .HTM:</text>
    <text x="300" y="122" class="code-text-sc">&lt;a href="RH-...02870.HTM"&gt;</text>

    <rect x="555" y="48" width="235" height="95" rx="8" fill="#0B132B" stroke="#3A506B"/>
    <text x="565" y="70" class="bold-sc">1.3 Metadata Preliminar</text>
    <text x="565" y="88" class="node-text-sc">• Asunto en lista</text>
    <text x="565" y="105" class="node-text-sc">• Tema de casación</text>
    <text x="565" y="122" class="node-text-sc">• Materia asignada</text>
  </g>

  <!-- Arrow Down 1 -> 2 -->
  <path d="M 450 310 L 450 340" stroke="#00F2FE" stroke-width="3" fill="none" marker-end="url(#arrow-down-cyan)"/>

  <!-- PASO 2: Apertura del Link y Despliegue de Ventana Emergente Pop-Up -->
  <g transform="translate(45, 345)">
    <rect x="0" y="0" width="810" height="160" rx="14" fill="url(#card-grad-sc)" stroke="#3A506B" stroke-width="2" filter="url(#shadow-sc)"/>
    <rect x="15" y="15" width="6" height="130" rx="3" fill="url(#amber-glow-sc)"/>
    
    <rect x="35" y="15" width="100" height="22" rx="4" fill="url(#amber-glow-sc)"/>
    <text x="85" y="30" text-anchor="middle" class="card-badge-sc">PASO 2</text>
    <text x="145" y="32" class="card-title-sc">Apertura del Link y Despliegue del Pop-Up Imprimible</text>

    <rect x="35" y="48" width="240" height="95" rx="8" fill="#0B132B" stroke="#FFB300" stroke-width="1.5"/>
    <text x="45" y="70" class="bold-sc" fill="#FFB300">2.1 Petición HTTP GET</text>
    <text x="45" y="88" class="node-text-sc">• Abre la URL que sale debajo</text>
    <text x="45" y="105" class="node-text-sc">  de "Ver Extracto:"</text>
    <text x="45" y="122" class="code-text-sc">fetch_url(popup_url)</text>

    <rect x="290" y="48" width="250" height="95" rx="8" fill="#0B132B" stroke="#3A506B"/>
    <text x="300" y="70" class="bold-sc">2.2 Ventana Emergente</text>
    <text x="300" y="88" class="node-text-sc">• Render de la vista imprimible</text>
    <text x="300" y="105" class="node-text-sc">• Encabezado oficial TSJ</text>
    <text x="300" y="122" class="node-text-sc">• Botón [IMPRIMIR DOCUMENTO]</text>

    <rect x="555" y="48" width="235" height="95" rx="8" fill="#0B132B" stroke="#3A506B"/>
    <text x="565" y="70" class="bold-sc">2.3 Parsing del Modal</text>
    <text x="565" y="88" class="node-text-sc">• Parse del texto del Pop-Up</text>
    <text x="565" y="105" class="node-text-sc">• Captura extracto completo</text>
    <text x="565" y="122" class="node-text-sc">• Ponente y Ratio Decidendi</text>
  </g>

  <!-- Arrow Down 2 -> 3 -->
  <path d="M 450 505 L 450 535" stroke="#FFB300" stroke-width="3" fill="none" marker-end="url(#arrow-down-amber)"/>

  <!-- PASO 3: Verificación de Relevancia del Contenido -->
  <g transform="translate(45, 540)">
    <rect x="0" y="0" width="810" height="160" rx="14" fill="url(#card-grad-sc)" stroke="#3A506B" stroke-width="2" filter="url(#shadow-sc)"/>
    <rect x="15" y="15" width="6" height="130" rx="3" fill="url(#purple-glow-sc)"/>
    
    <rect x="35" y="15" width="100" height="22" rx="4" fill="url(#purple-glow-sc)"/>
    <text x="85" y="30" text-anchor="middle" class="card-badge-sc" style="fill:#FFFFFF">PASO 3</text>
    <text x="145" y="32" class="card-title-sc">Verificación de Relevancia (Extracto Pop-Up &amp; Evidencia Digital)</text>

    <rect x="35" y="48" width="240" height="95" rx="8" fill="#0B132B" stroke="#F355DA" stroke-width="1.5"/>
    <text x="45" y="70" class="bold-sc" fill="#F355DA">3.1 Filtro TECH_KEYWORDS</text>
    <text x="45" y="88" class="node-text-sc">• "evidencia digital", "hash"</text>
    <text x="45" y="105" class="node-text-sc">• "delito informático"</text>
    <text x="45" y="122" class="node-text-sc">• "cadena de custodia"</text>

    <rect x="290" y="48" width="250" height="95" rx="8" fill="#0B132B" stroke="#3A506B"/>
    <text x="300" y="70" class="bold-sc">3.2 Limpieza Textual</text>
    <text x="300" y="88" class="code-text-sc">clean_text(extracto_popup)</text>
    <text x="300" y="105" class="node-text-sc">• Elimina etiquetas HTML</text>
    <text x="300" y="122" class="node-text-sc">• Normalización UTF-8</text>

    <rect x="555" y="48" width="235" height="95" rx="8" fill="#0B132B" stroke="#3A506B"/>
    <text x="565" y="70" class="bold-sc">3.3 Validación de Fallo</text>
    <text x="565" y="88" class="node-text-sc">✓ Ratio Decidendi válida</text>
    <text x="565" y="105" class="node-text-sc">✓ Aprobado para copiado</text>
    <text x="565" y="122" class="node-text-sc">  y almacenamiento</text>
  </g>

  <!-- Arrow Down 3 -> 4 -->
  <path d="M 450 700 L 450 730" stroke="#F355DA" stroke-width="3" fill="none" marker-end="url(#arrow-down-purple)"/>

  <!-- PASO 4: Copiado de la URL del Pop-Up como link_directo -->
  <g transform="translate(45, 735)">
    <rect x="0" y="0" width="810" height="160" rx="14" fill="url(#card-grad-sc)" stroke="#38F9D7" stroke-width="2" filter="url(#shadow-sc)"/>
    <rect x="15" y="15" width="6" height="130" rx="3" fill="url(#green-glow-sc)"/>
    
    <rect x="35" y="15" width="100" height="22" rx="4" fill="url(#green-glow-sc)"/>
    <text x="85" y="30" text-anchor="middle" class="card-badge-sc">PASO 4</text>
    <text x="145" y="32" class="card-title-sc">Copiado del Enlace Oficial del Pop-Up (link_directo)</text>

    <rect x="35" y="48" width="365" height="95" rx="8" fill="#0B132B" stroke="#38F9D7" stroke-width="1.5"/>
    <text x="50" y="70" class="bold-sc" fill="#38F9D7">4.1 Asignación de la URL Verificada</text>
    <text x="50" y="88" class="node-text-sc">• Copia la URL exacta que desplegó la ventana emergente:</text>
    <text x="50" y="108" class="code-text-sc">decision['link_directo'] = popup_url</text>
    <text x="50" y="125" class="node-text-sc">• Garantía: Cero enlaces rotos o discrepancias</text>

    <rect x="420" y="48" width="370" height="95" rx="8" fill="#0B132B" stroke="#38F9D7" stroke-width="1.5"/>
    <text x="435" y="70" class="bold-sc" fill="#38F9D7">4.2 Sanitización del Nombre de la Búsqueda</text>
    <text x="435" y="88" class="code-text-sc">name = sanitize_search_name(formula_busqueda)</text>
    <text x="435" y="108" class="node-text-sc">• Asigna nombre espejo a la BD SQLite y a la Matriz Excel</text>
    <text x="435" y="125" class="node-text-sc">• ej. Busqueda_Delitos_Informaticos</text>
  </g>

  <!-- Arrow Down 4 -> 5 -->
  <path d="M 450 895 L 450 925" stroke="#38F9D7" stroke-width="3" fill="none" marker-end="url(#arrow-down-green)"/>

  <!-- PASO 5: Almacenamiento Emparejado en BD SQLite y Excel -->
  <g transform="translate(45, 930)">
    <rect x="0" y="0" width="810" height="175" rx="14" fill="url(#card-grad-sc)" stroke="#38F9D7" stroke-width="2" filter="url(#shadow-sc)"/>
    <rect x="15" y="15" width="6" height="145" rx="3" fill="url(#green-glow-sc)"/>
    
    <rect x="35" y="15" width="100" height="22" rx="4" fill="url(#green-glow-sc)"/>
    <text x="85" y="30" text-anchor="middle" class="card-badge-sc">PASO 5</text>
    <text x="145" y="32" class="card-title-sc">Persistencia Emparejada 1:1 (SQLite DB + Matriz Excel)</text>

    <rect x="35" y="48" width="365" height="110" rx="8" fill="#0B132B" stroke="#38F9D7" stroke-width="1.5"/>
    <text x="50" y="72" class="bold-sc" fill="#38F9D7">🗄️ SQLite DB Dedicada</text>
    <text x="50" y="92" class="node-text-sc">• Guarda link_directo + extracto verificado del Pop-Up</text>
    <text x="50" y="110" class="code-text-sc">INSERT INTO decisiones ON CONFLICT(link_directo)...</text>
    <text x="50" y="128" class="node-text-sc">• data/Databases_SQLite/&lt;Busqueda_Formula&gt;.db</text>

    <rect x="420" y="48" width="370" height="110" rx="8" fill="#0B132B" stroke="#38F9D7" stroke-width="1.5"/>
    <text x="435" y="72" class="bold-sc" fill="#38F9D7">📊 Excel Emparejado (.xlsx)</text>
    <text x="435" y="92" class="node-text-sc">• Columna 8: Extracto Pop-Up | Columna 9: Link Directo</text>
    <text x="435" y="110" class="node-text-sc">• Hipervínculo azul clicable para abrir la sentencia oficial</text>
    <text x="435" y="128" class="node-text-sc">• data/Excel_Buscador/&lt;Busqueda_Formula&gt;.xlsx</text>
  </g>

  <!-- Bottom Code Sequence Summary (Folio Footer) -->
  <g transform="translate(45, 1120)">
    <rect x="0" y="0" width="810" height="180" rx="14" fill="#1C2541" stroke="#3A506B" stroke-width="1.5" filter="url(#shadow-sc)"/>
    <text x="30" y="35" class="card-title-sc" fill="#F8FAFC">⚡ SECUENCIA DE CÓDIGO PYTHON (EXTRACCIÓN &amp; GUARDA DE POP-UP)</text>

    <rect x="30" y="52" width="245" height="110" rx="8" fill="#0B132B" stroke="#3A506B"/>
    <text x="40" y="74" font-weight="700" fill="#00F2FE" font-size="11px" font-family="Segoe UI">1. Captura Link Lista</text>
    <text x="40" y="94" class="code-text-sc">link_popup = row.find(</text>
    <text x="40" y="110" class="code-text-sc">  'a', text=re.compile('HTM')</text>
    <text x="40" y="126" class="code-text-sc">)['href']</text>

    <rect x="290" y="52" width="250" height="110" rx="8" fill="#0B132B" stroke="#3A506B"/>
    <text x="300" y="74" font-weight="700" fill="#FFB300" font-size="11px" font-family="Segoe UI">2. Verificación Pop-Up</text>
    <text x="300" y="94" class="code-text-sc">html = fetch_url(link_popup)</text>
    <text x="300" y="110" class="code-text-sc">extracto = parse(html)</text>
    <text x="300" y="126" class="code-text-sc">decision['link'] = link_popup</text>

    <rect x="555" y="52" width="225" height="110" rx="8" fill="#0B132B" stroke="#3A506B"/>
    <text x="565" y="74" font-weight="700" fill="#38F9D7" font-size="11px" font-family="Segoe UI">3. Guardado Emparejado</text>
    <text x="565" y="94" class="code-text-sc">db.insertar(decision)</text>
    <text x="565" y="110" class="code-text-sc">export_excel(decision)</text>
    <text x="565" y="126" class="code-text-sc"># Cero discrepancias</text>

    <rect x="30" y="145" width="750" height="22" rx="4" fill="#0B132B"/>
    <text x="40" y="160" class="code-text-sc">TSJ Venezuelan Jurisprudence Scraper Engine • Standard Folio Vertical Print Format (900x1350)</text>
  </g>
</svg>
